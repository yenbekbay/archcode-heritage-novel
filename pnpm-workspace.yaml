allowBuilds:
  bufferutil: true
  es5-ext: true
  sharp: true
  utf-8-validate: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Immediate adoption approved for the story runtime upgrade.
  - "react-visual-novel@0.4.1"
overrides:
  # Security-fix patch releases that the parents' exact pins hold back.
  brace-expansion@5: 5.0.12
  js-yaml@4: 4.3.2
  zod@4: 4.6.7
packageExtensions:
  # The published Disqus modules import this development-only dependency.
  disqus-react@1.1.7:
    dependencies:
      prop-types: 15.8.1
verifyDepsBeforeRun: error
