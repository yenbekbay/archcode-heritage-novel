allowBuilds:
  bufferutil: true
  es5-ext: true
  re2: true
  sharp: true
  utf-8-validate: true
minimumReleaseAgeExclude:
  - "@utilfirst/eslint-plugin@0.4.10"
  # Immediate adoption approved for the story runtime upgrade.
  - "react-visual-novel@0.4.0"
packageExtensions:
  # The published Disqus modules import this development-only dependency.
  disqus-react@1.1.7:
    dependencies:
      prop-types: 15.8.1
